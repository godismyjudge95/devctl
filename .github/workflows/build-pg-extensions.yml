name: Build PostgreSQL Extensions

# Builds TimescaleDB, pgvector, and pg_clickhouse against the exact PostgreSQL
# builds devctl installs (Percona on Linux, EDB on macOS), so users need no
# compiler, cmake, git, or Xcode Command Line Tools.
#
# Runs when a release whose tag starts with "pg-extensions-" is published
# (e.g. pg-extensions-20261108.1). devctl pins that tag in
# install/pg_extensions_bundle.go. Manual dispatch builds and tests without
# a release upload.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-pg-extensions-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with install/postgres.go, install/timescaledb.go,
# install/pgext_pgvector.go, and install/pg_clickhouse.go.
# TestPgExtensionsWorkflowVersionsMatch fails when they drift.
env:
  PG_VERSION: "18.4"
  TIMESCALEDB_VERSION: "2.28.3"
  PGVECTOR_VERSION: "0.8.2"
  PG_CLICKHOUSE_VERSION: "0.11.0"

jobs:
  build:
    name: Build extensions (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'pg-extensions-')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 sets the glibc floor (2.39), the same as the PHP builds.
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-26
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake patchelf \
            libssl-dev liblz4-dev libzstd-dev libcurl4-openssl-dev uuid-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: cmake --version || brew install cmake

      - name: Build, package, and smoke test
        run: bash scripts/build-pg-extensions.sh "${{ matrix.platform }}" dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-extensions-${{ matrix.platform }}
          path: dist/*.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.tar.gz
