name: Build PHP Binaries

# Triggered only when a release whose tag starts with "php-binaries" is
# published (e.g. php-binaries-20260723.1). This keeps the expensive PHP
# compilation separate from regular devctl releases.
# Also supports manual dispatch for testing.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PHP 8.0–8.5: repackage static builds from dl.static-php.dev ───────────
  # Building every minor from source with the full extension set is brittle
  # (pre-built libsqlite often lacks SQLITE_ENABLE_COLUMN_METADATA). The
  # static-php.dev "common" builds are already static CLI/FPM binaries with
  # a solid extension set, so we rehost the latest patch per minor.
  package:
    name: Package PHP ${{ matrix.minor }} (linux-x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'php-binaries')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "8.0"
            patch: "8.0.30"
          - minor: "8.1"
            patch: "8.1.34"
          - minor: "8.2"
            patch: "8.2.32"
          - minor: "8.3"
            patch: "8.3.32"
          - minor: "8.4"
            patch: "8.4.23"
          - minor: "8.5"
            patch: "8.5.8"

    steps:
      - name: Download and repackage static binaries
        run: |
          set -euo pipefail
          MINOR="${{ matrix.minor }}"
          PATCH="${{ matrix.patch }}"
          BASE="https://dl.static-php.dev/static-php-cli/common"
          mkdir -p tmp_dist tmp_meta /tmp/cli /tmp/fpm

          curl -fsSL -o /tmp/cli.tgz "$BASE/php-${PATCH}-cli-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/fpm.tgz "$BASE/php-${PATCH}-fpm-linux-x86_64.tar.gz"
          tar xzf /tmp/cli.tgz -C /tmp/cli
          tar xzf /tmp/fpm.tgz -C /tmp/fpm

          if [ -f /tmp/cli/php ]; then
            cp /tmp/cli/php "tmp_dist/php-${MINOR}-cli-linux-x86_64"
          else
            cp "$(find /tmp/cli -type f -executable | head -1)" "tmp_dist/php-${MINOR}-cli-linux-x86_64"
          fi
          if [ -f /tmp/fpm/php-fpm ]; then
            cp /tmp/fpm/php-fpm "tmp_dist/php-${MINOR}-fpm-linux-x86_64"
          else
            cp "$(find /tmp/fpm -type f -executable | head -1)" "tmp_dist/php-${MINOR}-fpm-linux-x86_64"
          fi
          chmod 755 "tmp_dist/php-${MINOR}-cli-linux-x86_64" "tmp_dist/php-${MINOR}-fpm-linux-x86_64"

          ./tmp_dist/php-${MINOR}-cli-linux-x86_64 -v
          PHP_PATCH=$(./tmp_dist/php-${MINOR}-cli-linux-x86_64 -v | awk 'NR==1 {print $2}')
          # Sanity: reported patch must match the minor we claim.
          case "$PHP_PATCH" in
            ${MINOR}.*) ;;
            *)
              echo "expected PHP ${MINOR}.x, got ${PHP_PATCH}" >&2
              exit 1
              ;;
          esac

          cat > "tmp_meta/${MINOR}.json" <<EOF
          {
            "minor": "${MINOR}",
            "patch": "${PHP_PATCH}",
            "cli": "php-${MINOR}-cli-linux-x86_64",
            "fpm": "php-${MINOR}-fpm-linux-x86_64"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-meta-${{ matrix.minor }}
          path: tmp_meta/${{ matrix.minor }}.json

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp_dist/php-${{ matrix.minor }}-cli-linux-x86_64
            tmp_dist/php-${{ matrix.minor }}-fpm-linux-x86_64

  # ── Legacy PHP 7.0 / 7.2 / 7.4: build with static-php-cli + OpenSSL 1.1 ──
  # Not available on dl.static-php.dev. Best-effort: EOL PHP, reduced
  # extension set, no prefer-pre-built (prebuilt sqlite often fails validation).
  build-legacy:
    name: Build PHP ${{ matrix.php }} legacy (linux-x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'php-binaries')

    permissions:
      contents: write

    strategy:
      # Abort sibling 7.x jobs on first failure so we can fix/re-run sooner.
      # (package job is independent and still ships 8.x.)
      fail-fast: true
      matrix:
        php: ["7.0", "7.2", "7.4"]

    steps:
      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: main

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: downloads
          key: spc-legacy-downloads-${{ matrix.php }}-linux-x86_64-${{ github.run_id }}
          restore-keys: |
            spc-legacy-downloads-${{ matrix.php }}-linux-x86_64-

      - name: Check and fix build environment
        run: ./bin/spc-alpine-docker doctor --auto-fix

      - name: Set legacy extension list
        id: exts
        run: |
          # Keep the set small and well-supported on EOL PHP.
          # Note: static opcache is PHP >= 8.0 only (static-php-cli hard limit).
          case "${{ matrix.php }}" in
            7.0)
              LIST="bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,openssl,pcntl,pdo,pdo_mysql,phar,posix,readline,redis,session,simplexml,soap,sockets,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib"
              ;;
            7.2)
              LIST="bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,openssl,pcntl,pdo,pdo_mysql,phar,posix,readline,redis,session,simplexml,soap,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib"
              ;;
            7.4)
              LIST="bcmath,bz2,calendar,ctype,curl,dom,exif,ffi,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,openssl,pcntl,pdo,pdo_mysql,phar,posix,readline,redis,session,simplexml,soap,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib"
              ;;
            *)
              echo "unsupported legacy PHP version: ${{ matrix.php }}" >&2
              exit 1
              ;;
          esac
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Download PHP sources and dependency tarballs
        run: |
          # No --prefer-pre-built: prebuilt libsqlite often lacks
          # SQLITE_ENABLE_COLUMN_METADATA and fails extension sanity checks.
          ./bin/spc-alpine-docker download \
            --with-php=${{ matrix.php }} \
            --with-openssl11 \
            --for-extensions=${{ steps.exts.outputs.list }} \
            --ignore-cache-sources=php-src,sqlite \
            --retry=5

      - name: Build PHP CLI and FPM
        run: |
          ./bin/spc-alpine-docker build \
            ${{ steps.exts.outputs.list }} \
            --build-cli \
            --build-fpm \
            --debug

          mkdir -p tmp_dist tmp_meta
          cp buildroot/bin/php     tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
          cp buildroot/bin/php-fpm tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

          PHP_PATCH=$(./tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64 -v | awk 'NR==1 {print $2}')
          SAFE=$(echo "${{ matrix.php }}" | tr '.' '_')
          cat > "tmp_meta/${SAFE}.json" <<EOF
          {
            "minor": "${{ matrix.php }}",
            "patch": "${PHP_PATCH}",
            "cli": "php-${{ matrix.php }}-cli-linux-x86_64",
            "fpm": "php-${{ matrix.php }}-fpm-linux-x86_64"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-meta-${{ matrix.php }}
          path: tmp_meta/*.json

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
            tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

  # ── Assemble php-binaries.json from whatever jobs succeeded ───────────────
  manifest:
    name: Build PHP manifest
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'release' && startsWith(github.ref_name, 'php-binaries'))
    needs: [package, build-legacy]

    permissions:
      contents: write

    steps:
      - name: Download metadata artifacts
        uses: actions/download-artifact@v4
        with:
          path: php-meta
          pattern: php-meta-*
          merge-multiple: true
        continue-on-error: true

      - name: Assemble php-binaries.json
        run: |
          python3 - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          meta_dir = Path('php-meta')
          if not meta_dir.exists():
              print('No php-meta artifacts found', file=sys.stderr)
              sys.exit(1)

          rows = []
          for path in sorted(meta_dir.rglob('*.json')):
              rows.append(json.loads(path.read_text()))

          if not rows:
              print('No metadata JSON files found', file=sys.stderr)
              sys.exit(1)

          def minor_key(row):
              return tuple(int(p) for p in row['minor'].split('.'))

          rows.sort(key=minor_key)

          manifest = {
              'release_tag': '${{ github.ref_name }}',
              'built_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'php_versions': {row['minor']: row['patch'] for row in rows},
              'assets': {
                  row['minor']: {
                      'cli': row['cli'],
                      'fpm': row['fpm'],
                  } for row in rows
              },
          }

          Path('php-binaries.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          print(f'Shipped {len(rows)} PHP minor(s): {", ".join(r["minor"] for r in rows)}')
          PY

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: php-binaries.json
