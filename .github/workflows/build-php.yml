name: Build PHP Binaries

# Triggered only when a release whose tag starts with "php-binaries" is
# published (e.g. php-binaries-20260723.1). This keeps the expensive PHP
# compilation separate from regular devctl releases.
# Also supports manual dispatch for testing.
on:
  release:
    types: [published]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: build-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Modern PHP (8.1–8.5): current static-php-cli + full extension set ─────
  build:
    name: Build PHP ${{ matrix.php }} (linux-x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'php-binaries')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: main

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: downloads
          key: spc-downloads-${{ matrix.php }}-linux-x86_64-${{ github.run_id }}
          restore-keys: |
            spc-downloads-${{ matrix.php }}-linux-x86_64-

      - name: Check and fix build environment
        run: ./bin/spc-alpine-docker doctor --auto-fix

      - name: Set extensions for PHP version
        id: exts
        run: |
          # swoole requires PHP >= 8.2; SPX is available 8.1+
          if [ "${{ matrix.php }}" = "8.1" ]; then
            echo "list=apcu,bcmath,brotli,bz2,calendar,ctype,curl,dba,dom,event,exif,ffi,fileinfo,filter,ftp,gd,gmp,iconv,imagick,intl,ldap,libxml,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,opentelemetry,pcntl,pdo,pdo_mysql,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,xz,zip,zlib,zstd,spx" >> "$GITHUB_OUTPUT"
          else
            echo "list=apcu,bcmath,brotli,bz2,calendar,ctype,curl,dba,dom,event,exif,ffi,fileinfo,filter,ftp,gd,gmp,iconv,imagick,intl,ldap,libxml,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,opentelemetry,pcntl,pdo,pdo_mysql,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,swoole,swoole-hook-mysql,swoole-hook-pgsql,swoole-hook-sqlite,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,xz,zip,zlib,zstd,spx" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PHP sources and dependency tarballs
        run: |
          ./bin/spc-alpine-docker download \
            --with-php=${{ matrix.php }} \
            --for-extensions=${{ steps.exts.outputs.list }} \
            --prefer-pre-built \
            --ignore-cache-sources=php-src \
            --retry=5

      - name: Build PHP CLI and FPM
        run: |
          ./bin/spc-alpine-docker build \
            ${{ steps.exts.outputs.list }} \
            --build-cli \
            --build-fpm \
            --debug

          mkdir -p tmp_dist
          cp buildroot/bin/php     tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
          cp buildroot/bin/php-fpm tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

          PHP_PATCH=$(./tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64 -v | awk 'NR==1 {print $2}')
          mkdir -p tmp_meta
          cat > tmp_meta/${{ matrix.php }}.json <<EOF
          {
            "minor": "${{ matrix.php }}",
            "patch": "${PHP_PATCH}",
            "cli": "php-${{ matrix.php }}-cli-linux-x86_64",
            "fpm": "php-${{ matrix.php }}-fpm-linux-x86_64"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-meta-${{ matrix.php }}
          path: tmp_meta/${{ matrix.php }}.json

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
            tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

  # ── PHP 8.0: repackage proven static builds from static-php.dev ───────────
  # Current static-php-cli no longer maintains 8.0 builds. The common builds
  # on dl.static-php.dev are still static CLI/FPM binaries we can rehost.
  package-php80:
    name: Package PHP 8.0 (linux-x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'php-binaries')

    permissions:
      contents: write

    steps:
      - name: Download and repackage PHP 8.0 static binaries
        run: |
          set -euo pipefail
          PATCH=8.0.30
          BASE="https://dl.static-php.dev/static-php-cli/common"
          mkdir -p tmp_dist tmp_meta

          curl -fsSL -o /tmp/cli.tgz "$BASE/php-${PATCH}-cli-linux-x86_64.tar.gz"
          curl -fsSL -o /tmp/fpm.tgz "$BASE/php-${PATCH}-fpm-linux-x86_64.tar.gz"

          mkdir -p /tmp/cli /tmp/fpm
          tar xzf /tmp/cli.tgz -C /tmp/cli
          tar xzf /tmp/fpm.tgz -C /tmp/fpm

          # Tarballs contain a single binary named php / php-fpm
          if [ -f /tmp/cli/php ]; then
            cp /tmp/cli/php tmp_dist/php-8.0-cli-linux-x86_64
          else
            cp "$(find /tmp/cli -type f -executable | head -1)" tmp_dist/php-8.0-cli-linux-x86_64
          fi
          if [ -f /tmp/fpm/php-fpm ]; then
            cp /tmp/fpm/php-fpm tmp_dist/php-8.0-fpm-linux-x86_64
          else
            cp "$(find /tmp/fpm -type f -executable | head -1)" tmp_dist/php-8.0-fpm-linux-x86_64
          fi
          chmod 755 tmp_dist/php-8.0-cli-linux-x86_64 tmp_dist/php-8.0-fpm-linux-x86_64

          ./tmp_dist/php-8.0-cli-linux-x86_64 -v
          PHP_PATCH=$(./tmp_dist/php-8.0-cli-linux-x86_64 -v | awk 'NR==1 {print $2}')

          cat > tmp_meta/8.0.json <<EOF
          {
            "minor": "8.0",
            "patch": "${PHP_PATCH}",
            "cli": "php-8.0-cli-linux-x86_64",
            "fpm": "php-8.0-fpm-linux-x86_64"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-meta-8.0
          path: tmp_meta/8.0.json

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp_dist/php-8.0-cli-linux-x86_64
            tmp_dist/php-8.0-fpm-linux-x86_64

  # ── Legacy PHP (7.0 / 7.2 / 7.4): older static-php-cli + OpenSSL 1.1 ──────
  # These versions are EOL and no longer supported by current static-php-cli.
  # We pin an older spc release that still knew how to fetch/build them, with
  # a reduced extension set (no swoole/spx/opentelemetry).
  build-legacy:
    name: Build PHP ${{ matrix.php }} legacy (linux-x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'php-binaries')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        php: ["7.0", "7.2", "7.4"]

    steps:
      - name: Checkout static-php-cli (legacy)
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          # 2.3.0 is the last line that advertised 7.x partial support and
          # still has --with-openssl11 for pre-OpenSSL-3 PHP builds.
          ref: 2.3.0

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: downloads
          key: spc-legacy-downloads-${{ matrix.php }}-linux-x86_64-${{ github.run_id }}
          restore-keys: |
            spc-legacy-downloads-${{ matrix.php }}-linux-x86_64-

      - name: Check and fix build environment
        run: ./bin/spc-alpine-docker doctor --auto-fix

      - name: Set legacy extension list
        id: exts
        run: |
          # Core extensions shared by Laravel 5.x / WordPress / older apps.
          # Deliberately omit: swoole, spx, opentelemetry, ffi (7.4+ only),
          # sodium (7.2+), imagick (often fails on ancient toolchains).
          case "${{ matrix.php }}" in
            7.0)
              LIST="bcmath,bz2,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"
              ;;
            7.2)
              LIST="bcmath,bz2,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"
              ;;
            7.4)
              LIST="bcmath,bz2,calendar,ctype,curl,dba,dom,exif,ffi,fileinfo,filter,ftp,gd,gmp,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"
              ;;
            *)
              echo "unsupported legacy PHP version: ${{ matrix.php }}" >&2
              exit 1
              ;;
          esac
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Download PHP sources and dependency tarballs
        run: |
          ./bin/spc-alpine-docker download \
            --with-php=${{ matrix.php }} \
            --with-openssl11 \
            --for-extensions=${{ steps.exts.outputs.list }} \
            --prefer-pre-built \
            --ignore-cache-sources=php-src \
            --retry=5

      - name: Build PHP CLI and FPM
        run: |
          ./bin/spc-alpine-docker build \
            ${{ steps.exts.outputs.list }} \
            --build-cli \
            --build-fpm \
            --debug

          mkdir -p tmp_dist
          cp buildroot/bin/php     tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
          cp buildroot/bin/php-fpm tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

          PHP_PATCH=$(./tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64 -v | awk 'NR==1 {print $2}')
          mkdir -p tmp_meta
          # Artifact path cannot contain dots in some GH Actions edge cases —
          # use a safe filename and put the real minor inside the JSON.
          SAFE=$(echo "${{ matrix.php }}" | tr '.' '_')
          cat > "tmp_meta/${SAFE}.json" <<EOF
          {
            "minor": "${{ matrix.php }}",
            "patch": "${PHP_PATCH}",
            "cli": "php-${{ matrix.php }}-cli-linux-x86_64",
            "fpm": "php-${{ matrix.php }}-fpm-linux-x86_64"
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          # Keep dots out of the artifact *name* (underscore) — minor is in JSON.
          name: php-meta-${{ matrix.php }}
          path: tmp_meta/*.json

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp_dist/php-${{ matrix.php }}-cli-linux-x86_64
            tmp_dist/php-${{ matrix.php }}-fpm-linux-x86_64

  # ── Assemble php-binaries.json from whatever matrix cells succeeded ───────
  manifest:
    name: Build PHP manifest
    runs-on: ubuntu-latest
    # Run even if some version builds failed so successful versions still ship.
    if: >-
      always() &&
      (github.event_name == 'release' && startsWith(github.ref_name, 'php-binaries'))
    needs: [build, package-php80, build-legacy]

    permissions:
      contents: write

    steps:
      - name: Download metadata artifacts
        uses: actions/download-artifact@v4
        with:
          path: php-meta
          pattern: php-meta-*
          merge-multiple: true
        continue-on-error: true

      - name: Assemble php-binaries.json
        run: |
          python3 - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          meta_dir = Path('php-meta')
          if not meta_dir.exists():
              print('No php-meta artifacts found', file=sys.stderr)
              sys.exit(1)

          rows = []
          for path in sorted(meta_dir.rglob('*.json')):
              rows.append(json.loads(path.read_text()))

          if not rows:
              print('No metadata JSON files found', file=sys.stderr)
              sys.exit(1)

          # Stable sort by minor version (e.g. 7.0 < 7.2 < 8.0 < 8.5)
          def minor_key(row):
              parts = row['minor'].split('.')
              return tuple(int(p) for p in parts)

          rows.sort(key=minor_key)

          manifest = {
              'release_tag': '${{ github.ref_name }}',
              'built_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'php_versions': {row['minor']: row['patch'] for row in rows},
              'assets': {
                  row['minor']: {
                      'cli': row['cli'],
                      'fpm': row['fpm'],
                  } for row in rows
              },
          }

          Path('php-binaries.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          print(f'Shipped {len(rows)} PHP minor(s): {", ".join(r["minor"] for r in rows)}')
          PY

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: php-binaries.json
